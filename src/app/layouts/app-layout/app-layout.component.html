<!-- Spacer if takeSpace is true -->
<div *ngIf="takeSpace" class="spacer"></div>

<!-- Header Section -->
<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="/logo2edit.webp" alt="VelvetCove Logo" [style.height.px]="isScrolled ? 40 : 50">
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <a routerLink="/">Home</a>
      <a routerLink="/products">Shop</a>
      <a routerLink="/contact">Contact</a>
    </nav>

    <!-- Icons & Buttons -->
    <div class="icons">
      <a *ngIf="uniqueItemsCount >= 1" routerLink="/cart">
        <span class="cart-badge">{{ uniqueItemsCount }}</span> 🛒
      </a>
      <a routerLink="/account">👤</a>
      <button *ngIf="token" (click)="handleLogout()">🚪</button>
      <button class="lg:hidden" (click)="toggleDrawer()">☰</button>
    </div>
  </div>
</header>

<!-- Drawer (Mobile Menu) -->
<div *ngIf="drawerOpened" class="drawer open">
  <button (click)="toggleDrawer()">✖</button>
  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/shop">Shop</a>
    <a routerLink="/about">About Us</a>
    <a routerLink="/contact">Contact</a>
  </nav>
</div>

<!-- Main Content -->
<main class="main">
  <ng-content></ng-content>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-container">
    <a routerLink="/">
      <img src="/logo2edit.webp" alt="VelvetCove Logo">
    </a>
    <div class="footer-links">
      <a href="/" target="_blank" rel="noopener noreferrer">📘 Facebook</a>
      <a href="/" target="_blank" rel="noopener noreferrer">🐦 Twitter</a>
      <a href="/" target="_blank" rel="noopener noreferrer">📷 Instagram</a>
    </div>
  </div>
</footer>
