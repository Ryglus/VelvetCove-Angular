<div class="container">
  <h2 *ngIf="title">{{ title.toUpperCase() }}</h2>
  <p *ngIf="!title">More from {{ category }}</p>

  <div *ngIf="products$ | async as products">
    <div *ngIf="products.length > 0; else noProducts">
      <!-- Large Grid -->
      <div *ngIf="size === 'lg'" class="grid lg:grid-cols-2 gap-6">
        <app-product-card *ngIf="products[0]" [product]="products[0]" size="lg"></app-product-card>
        <div class="grid grid-cols-2 gap-4">
          <app-product-card *ngFor="let product of products.slice(1, 5)" [product]="product"></app-product-card>
        </div>
      </div>

      <!-- Medium Grid -->
      <div *ngIf="size === 'md'" class="grid grid-cols-2 md:grid-cols-4 gap-6">
        <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
      </div>

      <!-- Small Grid -->
      <div *ngIf="size === 'sm'" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
      </div>
    </div>

    <ng-template #noProducts>
      <p class="text-red-500">No recommended products found.</p>
    </ng-template>
  </div>
</div>
