<app-layout [takeSpace]="true">
<app-svg-page-bg>
  <div class="container">
    <!-- HEADER SECTION -->
    <div class="flex justify-between items-center">
      <h1>PRODUCTS FROM {{ category() ? category() : "ALL CATEGORIES" }}</h1>


      <option *ngFor="let option of [3,6,9]" [value]="option">{{ option }} per page</option>

    </div>

    <div class="grid">
      <!-- SIDEBAR FILTERS -->
      <div class="sidebar">
        <app-product-filter
          [nameFilter]="query().name"
          [minPrice]="query().minPrice"
          [maxPrice]="query().maxPrice"
          [minRating]="query().minRating"
          [categoryFilter]="query().categoryFilter"
          [categories]="categories()"
          (nameChange)="setQuery({ name: $event })"
          (minPriceChange)="setQuery({ minPrice: $event })"
          (maxPriceChange)="setQuery({ maxPrice: $event })"
          (minRatingChange)="setQuery({ minRating: $event })"
          (categoryChange)="handleCategoryChange($event)"
          (clearFilters)="setQuery({ name: '', minPrice: null, maxPrice: null, minRating: null, categoryFilter: null, page: 1 })"
        ></app-product-filter>
      </div>

      <!-- PRODUCT LISTING -->
      <div class="content">
        <ng-container *ngIf="paginatedProducts().length > 0; else loading">
          <div class="grid-container grid-cols-3">
            <app-product-card *ngFor="let product of paginatedProducts()" [product]="product"></app-product-card>
          </div>

          <!-- PAGINATION CONTROLS -->

        </ng-container>

        <!-- LOADING STATE -->
        <ng-template #loading>
          <div class="loading">Loading products...</div>
        </ng-template>
      </div>
    </div>
  </div>
</app-svg-page-bg>
</app-layout>
