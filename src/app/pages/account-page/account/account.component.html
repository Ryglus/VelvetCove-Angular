<app-layout [takeSpace]="true">
  <app-svg-page-bg>
    <div class="container">
      <button class="button gray full-width" routerLink="/dashboard/products">Go to Admin</button>

      <div class="button-group">
        <button class="button primary">Edit Account</button>
        <button class="button danger" (click)="logout()">Logout</button>
      </div>

      <div class="avatar-container">
        <img
          class="avatar"
          [src]="'https://api.dicebear.com/9.x/lorelei/svg?seed=' + (user()?.name?.firstname || '') + '-' + (user()?.name?.lastname || '')"
          alt="{{ user()?.name?.firstname }} {{ user()?.name?.lastname }}"
        />
      </div>

      <h2 class="text-center">{{ user()?.name?.firstname }} {{ user()?.name?.lastname }}</h2>

      <hr />

      <div class="info-list">
        <p><strong>Username:</strong> {{ user()?.username }}</p>
        <p><strong>Email:</strong> {{ user()?.email }}</p>
        <p><strong>Phone:</strong> {{ user()?.phone }}</p>
        <p><strong>Address:</strong> {{ user()?.address?.street }}, {{ user()?.address?.city }}</p>
      </div>

      <hr />
    </div>
  </app-svg-page-bg>

</app-layout>
