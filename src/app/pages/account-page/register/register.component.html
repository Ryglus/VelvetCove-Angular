<app-svg-page-bg>
  <app-layout>
    <div class="container">
      <div class="box">
        <h2 class="title">Create an Account</h2>

        <form [formGroup]="registerForm" (ngSubmit)="handleRegister()">
          <div class="stack">
            <div class="group">
              <div class="input-container">
                <label>First Name</label>
                <input type="text" formControlName="firstname" placeholder="John" required />
              </div>

              <div class="input-container">
                <label>Last Name</label>
                <input type="text" formControlName="lastname" placeholder="Doe" required />
              </div>
            </div>
            <div class="input-container">
              <label>Date of birth</label>
              <input type="date" formControlName="date" required />
            </div>
            <div class="input-container">
              <label>Username</label>
              <input type="text" formControlName="username" placeholder="Choose a username" required />
            </div>

            <div class="input-container">
              <label>Email</label>
              <input type="email" formControlName="email" placeholder="Enter your email" required />
            </div>

            <div class="input-container">
              <label>Password</label>
              <input type="password" formControlName="password" placeholder="Choose a strong password" required />
            </div>

            <button type="submit" [disabled]="isLoading()">Register</button>

            <p *ngIf="errorMessage()" class="error">{{ errorMessage() }}</p>
          </div>
        </form>

        <hr />

        <div class="group">
          <a routerLink="/account/login" class="outline-button">Already have an account? Login</a>
        </div>
      </div>
    </div>
  </app-layout>
</app-svg-page-bg>
