<div class="carousel">
  <div class="carousel-inner" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
    <div *ngFor="let slide of slides; let i = index" class="carousel-item" [style.backgroundImage]="'url(' + slide.src + ')'">
      <div class="carousel-caption">
        <h3>{{ slide.title }}</h3>
        <p>{{ slide.subtitle }}</p>
        <button class="shop-btn" (click)="goToCategory(slide.category)">Shop Now</button>
      </div>
    </div>
  </div>
  <button class="carousel-btn prev" (click)="prevSlide()">❮</button>
  <button class="carousel-btn next" (click)="nextSlide()">❯</button>
</div>
